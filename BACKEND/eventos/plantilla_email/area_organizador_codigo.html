<!DOCTYPE html>
<html lang="gl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitaciones - brasinda.com</title>
    <style>
      body {
        background: #f7f7fa;
        font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
        color: #222;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 480px;
        margin: 40px auto;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        padding: 32px 28px 28px 28px;
        text-align: center;
      }
      .logo {
        width: 60px;
        margin-bottom: 4px;
      }
      h1 {
        color: #ff0093;
        font-size: 1.6rem;
        margin: 16px 0 8px 0;
        font-weight: 700;
      }
      h2 {
        color: #222;
        font-size: 1.2rem;
        margin: 8px 0 16px 0;
        font-weight: 600;
      }
      h3 {
        color: #666;
        font-size: 0.95rem;
        margin: 4px 0;
        font-weight: 400;
      }
      p {
        font-size: 1rem;
        margin-bottom: 16px;
        color: #444;
        line-height: 1.5;
      }
      .ticket-icon {
        font-size: 2.8rem;
        margin-bottom: 12px;
      }
      .event-info {
        background: #f5f5f7;
        border-left: 4px solid #ff0093;
        padding: 16px;
        margin: 20px 0;
        border-radius: 6px;
        text-align: left;
      }
      .event-info h3 {
        margin: 0 0 8px 0;
        color: #ff0093;
        font-weight: 600;
      }
      .event-info p {
        margin: 4px 0;
        font-size: 0.95rem;
      }
      .validation-code {
        background: #fff3f9;
        border: 2px solid #ff0093;
        border-radius: 8px;
        padding: 16px;
        margin: 16px 0;
        text-align: center;
      }
      .validation-code-label {
        font-size: 0.8rem;
        color: #ff0093;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: block;
        margin-bottom: 8px;
      }
      .validation-code-value {
        font-size: 2rem;
        font-weight: 700;
        color: #222;
        letter-spacing: 2px;
        font-family: 'Courier New', monospace;
      }
      .qr-section {
        margin: 16px 0;
      }
      .qr-img {
        width: 120px;
        height: 120px;
        border-radius: 8px;
        border: 1px solid #eee;
      }
      .qr-text {
        font-size: 0.85rem;
        color: #888;
        margin-top: 8px;
      }
      .tickets-info {
        background: #fffbf5;
        border: 1px solid #ffdbea;
        border-radius: 8px;
        padding: 16px;
        margin: 16px 0;
        text-align: left;
      }
      .tickets-info strong {
        color: #ff0093;
        display: block;
        margin-bottom: 8px;
        font-size: 1rem;
      }
      .tickets-list {
        font-size: 0.95rem;
        color: #444;
        margin: 0;
        padding-left: 20px;
      }
      .instruction {
        background: #f0f0f0;
        border-radius: 8px;
        padding: 12px 16px;
        margin: 16px 0;
        font-size: 0.95rem;
        color: #555;
        text-align: left;
      }
      .instruction strong {
        color: #ff0093;
      }
      .footer {
        margin-top: 32px;
        font-size: 0.95rem;
        color: #aaa;
        border-top: 1px solid #f0f0f0;
        padding-top: 20px;
      }
      .footer a {
        color: #ff0093;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      
      <div class="ticket-icon">🔐</div>
      <h1>Código de acceso</h1>
      <h1 style="color: black;"><strong>{{ validation_code }}</strong></h1>
      <p>O código caducará en 10 minutos</p>

      <div class="footer">
        &copy; 2026 brasinda.com<br />
        <span style="font-size: 0.85rem;">Preguntas? <a href="mailto:eventos@brasinda.com">Contacta connosco</a></span>
      </div>
    </div>
  </body>
</html>
